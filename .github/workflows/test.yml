name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: packages/nextjs
      
      - name: Run linter
        run: yarn lint
        working-directory: packages/nextjs
      
      - name: Run type checking
        run: yarn check-types
        working-directory: packages/nextjs
      
      - name: Run unit and integration tests
        run: yarn test:ci
        working-directory: packages/nextjs
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: packages/nextjs/coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: packages/nextjs
      
      - name: Install Playwright browsers
        run: yarn playwright:install
        working-directory: packages/nextjs
      
      - name: Build application
        run: yarn build
        working-directory: packages/nextjs
        env:
          NEXT_PUBLIC_PROVIDER_URL: http://127.0.0.1:8545
          MONGODB_URI: mongodb://localhost:27017/test
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000
      
      - name: Run E2E tests - ${{ matrix.browser }}
        run: yarn playwright test --project=${{ matrix.browser }}
        working-directory: packages/nextjs
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          MONGODB_URI: mongodb://localhost:27017/test
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/nextjs/playwright-report/
          retention-days: 30

  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-integration-tests]
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: packages/nextjs
      
      - name: Generate coverage report
        run: yarn test:coverage
        working-directory: packages/nextjs
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          NEXTAUTH_SECRET: test-secret-key
      
      - name: Comment PR with coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/nextjs
          coverage-file: ./coverage/coverage-final.json
          base-coverage-file: ./coverage/coverage-final.json
          threshold: 80